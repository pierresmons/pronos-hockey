<!DOCTYPE html>
<!-- Pronos Hockey championnat v2 - version du 17/10/2026 (3 onglets + reglages) -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pronos Hockey">
<meta name="theme-color" content="#0a1420">
<title>Pronos Hockey — Championnat belge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a1420;
    --panel:#101f30;
    --panel-2:#16293d;
    --panel-3:#1c3149;
    --line:#24425e;
    --ice:#eaf6fb;
    --ice-dim:#93aec2;
    --ice-faint:#5f7c92;
    --red:#d5262f;
    --red-dark:#8f1a20;
    --gold:#f0a93b;
    --green:#2fae66;
    --input-bg:#050b12;
    --soft:rgba(255,255,255,.06);
    --soft-2:rgba(255,255,255,.18);
    --tabbar:rgba(10,20,32,0.96);
    --link-line:rgba(255,255,255,.35);
    --shadow:none;
    color-scheme:dark;
    --font-display:'Teko','Oswald','Arial Narrow',sans-serif;
    --font-body:'Inter',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono','Space Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ice);font-family:var(--font-body);}
  body{min-height:100vh;}
  #app{max-width:760px;margin:0 auto;padding:0 0 60px;}

  .rink-header{
    position:relative;
    overflow:hidden;
    background:linear-gradient(180deg,#0c1c2c 0%,#0a1420 100%);
    border-bottom:3px solid var(--red);
    padding:32px 24px 22px;
    text-align:center;
  }
  .rink-header::before{
    content:"";
    position:absolute;
    top:-120px;left:50%;
    width:360px;height:360px;
    transform:translateX(-50%);
    border:2px solid rgba(234,246,251,0.07);
    border-radius:50%;
  }
  .rink-header::after{
    content:"";
    position:absolute;
    top:-10px;left:50%;
    width:8px;height:8px;
    transform:translateX(-50%);
    background:rgba(213,38,47,0.35);
    border-radius:50%;
  }
  .eyebrow{
    position:relative;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--red);
    margin:0 0 6px;
    font-weight:700;
  }
  h1.title{
    position:relative;
    font-family:var(--font-display);
    font-weight:700;
    font-size:44px;
    line-height:0.95;
    letter-spacing:0.01em;
    text-transform:uppercase;
    margin:0;
    color:var(--ice);
  }
  h1.title span{color:var(--red);}
  .subtitle{
    position:relative;
    font-size:13px;
    color:var(--ice-dim);
    margin:8px 0 0;
  }

  .players-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    padding:16px 20px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    align-items:center;
  }
  .players-label{
    font-family:var(--font-mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--ice-faint);
    margin-right:4px;
  }
  .chip{
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    padding:7px 14px;
    border-radius:999px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--ice-dim);
    cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip:hover{border-color:var(--ice-faint);}
  .chip.active{
    background:var(--red);
    border-color:var(--red);
    color:#fff;
  }
  .chip-add{
    font-family:var(--font-mono);
    font-size:16px;
    line-height:1;
    padding:7px 12px;
    border-radius:999px;
    background:transparent;
    border:1px dashed var(--ice-faint);
    color:var(--ice-faint);
    cursor:pointer;
  }
  .chip-add:hover{color:var(--ice);border-color:var(--ice);}
  .inline-input{
    background:var(--input-bg);
    border:1px solid var(--line);
    border-radius:999px;
    color:var(--ice);
    font-family:var(--font-body);
    font-size:13px;
    padding:6px 14px;
    width:130px;
  }
  .inline-input:focus{outline:none;border-color:var(--red);}
  .btn-sm{padding:6px 12px;font-size:12px;border-radius:999px;}
  .room-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 20px;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ice-faint);
  }
  .room-code b{color:var(--gold);letter-spacing:0.05em;}
  .pool-matches-list{
    margin-top:8px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .pool-match-line{
    font-size:12.5px;
    color:var(--ice-dim);
  }
  .pool-match-line b{color:var(--ice);}
  .pool-match-line .match-date{margin-right:6px;}

  .tabs{
    display:flex;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:10;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:13px 8px;
    font-family:var(--font-display);
    font-size:17px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--ice-faint);
    cursor:pointer;
    border-bottom:3px solid transparent;
    background:none;
    border-top:none;border-left:none;border-right:none;
  }
  .tab.active{color:var(--ice);border-bottom-color:var(--red);}

  .content{padding:22px 20px 0;}

  .section-title{
    font-family:var(--font-display);
    font-size:22px;
    text-transform:uppercase;
    letter-spacing:0.02em;
    color:var(--ice);
    margin:0 0 4px;
  }
  .section-hint{
    font-size:12.5px;
    color:var(--ice-faint);
    margin:0 0 18px;
    line-height:1.5;
  }
  .legend{
    display:inline-flex;
    gap:14px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ice-dim);
    flex-wrap:wrap;
  }
  .legend b{color:var(--gold);}

  .filter-row{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .filter-row-scroll{
    flex-wrap:nowrap;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:6px;
    scrollbar-width:thin;
  }
  .filter-row-scroll .filter-chip{
    flex-shrink:0;
    padding:6px 11px;
    min-width:34px;
    text-align:center;
  }
  .filter-chip{
    font-family:var(--font-mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-weight:700;
    padding:6px 12px;
    border-radius:6px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ice-faint);
    cursor:pointer;
  }
  .filter-chip.active{
    background:var(--panel-3);
    border-color:var(--gold);
    color:var(--gold);
  }
  .date-select{
    font-family:var(--font-mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-weight:700;
    padding:6px 12px;
    border-radius:6px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ice-faint);
    cursor:pointer;
    max-width:100%;
  }
  .date-select.active{
    background:var(--panel-3);
    border-color:var(--gold);
    color:var(--gold);
  }
  .filters-toggle-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .filters-toggle-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    border:1px solid var(--line);
  }
  .filter-count-badge{
    background:var(--red);
    color:#fff;
    border-radius:999px;
    padding:1px 7px;
    font-size:10px;
    font-family:var(--font-mono);
    font-weight:700;
  }
  .chev{font-size:10px;color:var(--ice-faint);}
  .filters-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 14px 4px;
    margin-bottom:16px;
  }
  .filters-panel .filter-row{margin-bottom:10px;}
  .date-select:focus{outline:none;border-color:var(--gold);}

  .match-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:12px;
  }
  .match-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    gap:8px;
    flex-wrap:wrap;
  }
  .match-meta{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .match-date{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ice-faint);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .cat-badge{
    font-family:var(--font-mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-weight:700;
    padding:2px 7px;
    border-radius:4px;
  }
  .cat-badge.cat-f{background:rgba(212,83,126,0.18);color:#e79bb6;}
  .cat-badge.cat-h{background:rgba(55,138,221,0.18);color:#7db3ec;}
  .pool-badge{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--ice-faint);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .venue-badge{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--ice-faint);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .venue-badge::before{content:"\1F4CD ";}
  .match-status{
    font-family:var(--font-mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    padding:2px 8px;
    border-radius:4px;
  }
  .status-open{background:rgba(47,174,102,0.15);color:var(--green);}
  .status-done{background:rgba(240,169,59,0.15);color:var(--gold);}

  .scoreboard{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:10px;
  }
  .team{
    font-family:var(--font-display);
    font-size:19px;
    letter-spacing:0.01em;
    text-transform:uppercase;
    color:var(--ice);
    text-align:center;
    line-height:1.1;
  }
  .team.team-a{text-align:right;}
  .team.team-b{text-align:left;}
  .score-inputs{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .digit{
    width:46px;
    height:46px;
    background:var(--input-bg);
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--red);
    font-family:var(--font-mono);
    font-weight:700;
    font-size:22px;
    text-align:center;
    padding:0;
  }
  .digit:focus{outline:none;border-color:var(--red);}
  .digit:disabled{color:var(--ice-dim);background:#0d1826;}
  .vs-dash{color:var(--ice-faint);font-family:var(--font-mono);font-size:14px;}

  .match-actions{
    margin-top:12px;
    display:flex;
    justify-content:flex-end;
    gap:8px;
    align-items:center;
  }
  .btn{
    font-family:var(--font-body);
    font-size:12.5px;
    font-weight:600;
    padding:8px 14px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--ice);
    cursor:pointer;
  }
  .btn:hover{border-color:var(--ice-faint);}
  .btn-primary{background:var(--red);border-color:var(--red);color:#fff;}
  .btn-primary:hover{background:var(--red-dark);border-color:var(--red-dark);}
  .btn-ghost{background:transparent;border:1px solid transparent;color:var(--ice-faint);}
  .btn-ghost:hover{color:var(--ice);}
  .save-msg{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--green);
    opacity:0;
    transition:opacity .3s;
  }
  .save-msg.show{opacity:1;}

  .predictions-list{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    display:flex;
    flex-wrap:wrap;
    gap:6px 14px;
  }
  .pred-tag{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--ice-dim);
  }
  .pred-tag b{color:var(--ice);}
  .pred-tag.exact{color:var(--gold);}
  .pred-tag.exact b{color:var(--gold);}
  .pred-tag.correct{color:var(--green);}
  .pred-tag.wrong{color:var(--ice-faint);}

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ice-faint);
  }
  .empty .big{font-family:var(--font-display);font-size:26px;color:var(--ice-dim);text-transform:uppercase;margin-bottom:6px;}
  .empty p{font-size:13px;margin:0;}

  table.leaderboard{width:100%;border-collapse:collapse;margin-top:6px;}
  table.leaderboard th{
    font-family:var(--font-mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ice-faint);
    text-align:left;
    padding:0 10px 10px;
    border-bottom:1px solid var(--line);
  }
  table.leaderboard th.num, table.leaderboard td.num{text-align:right;}
  table.leaderboard td{
    padding:12px 10px;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  table.leaderboard tr:last-child td{border-bottom:none;}
  .rank{
    font-family:var(--font-mono);
    font-weight:700;
    color:var(--ice-faint);
    width:26px;
    display:inline-block;
  }
  .rank.r1{color:var(--gold);}
  .rank.r2{color:#c8ccd1;}
  .rank.r3{color:#c98a4d;}
  .player-name{font-weight:600;}
  .points-val{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:17px;
    color:var(--ice);
  }
  .points-sub{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--ice-faint);
  }

  .admin-form{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:20px;
  }
  .form-row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .form-row input{flex:1;min-width:110px;}
  input[type=text], input[type=date]{
    background:var(--input-bg);
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--ice);
    font-family:var(--font-body);
    font-size:13.5px;
    padding:9px 10px;
  }
  input[type=text]:focus, input[type=date]:focus{outline:none;border-color:var(--red);}
  input[type=text]::placeholder{color:var(--ice-faint);}

  .admin-match-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .admin-match-row:last-child{border-bottom:none;}
  .admin-match-info{
    display:flex;
    flex-direction:column;
    gap:4px;
    min-width:0;
  }
  .admin-teams-line{display:flex;align-items:center;flex-wrap:wrap;}
  .admin-teams{font-family:var(--font-display);font-size:17px;text-transform:uppercase;color:var(--ice);}
  .admin-meta-line{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .admin-date{font-family:var(--font-mono);font-size:11px;color:var(--ice-faint);}
  .admin-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .admin-score-input{
    width:38px;height:34px;
    text-align:center;
    background:var(--input-bg);
    border:1px solid var(--line);
    border-radius:5px;
    color:var(--gold);
    font-family:var(--font-mono);
    font-weight:700;
  }

  .toast{
    position:fixed;
    bottom:20px;left:50%;
    transform:translateX(-50%);
    background:var(--panel-3);
    border:1px solid var(--red);
    color:var(--ice);
    padding:10px 18px;
    border-radius:8px;
    font-size:13px;
    font-family:var(--font-body);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  @media (max-width:480px){
    h1.title{font-size:34px;}
    .team{font-size:15px;}
    .digit{width:38px;height:40px;font-size:18px;}
  }

  .pool-picker{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--input-bg);margin-bottom:10px;}
  .pool-group-title{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--gold);margin:10px 0 4px;cursor:pointer;}
  .pool-opt{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ice-dim);padding:3px 0;cursor:pointer;}
  .pool-opt input{accent-color:var(--red);}
  .pool-opt.checked{color:var(--ice);}
  .search-input{width:100%;margin-bottom:8px;}
  .clr-wrap{position:relative;display:block;width:100%;margin-bottom:8px;}
  .clr-wrap.clr-team{max-width:420px;margin-bottom:6px;}
  .filter-row .clr-wrap{flex:1;margin-bottom:0;}
  .clr-wrap > input{width:100%;margin-bottom:0 !important;padding-right:40px;box-sizing:border-box;}
  .clr-wrap input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none;}
  .clr-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:none;background:var(--panel-3, rgba(255,255,255,.15));color:var(--ice);font-size:20px;line-height:28px;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .clr-x[hidden]{display:none;}
  .selected-count{font-family:var(--font-mono);font-size:11px;color:var(--gold);}
  .sync-line{font-family:var(--font-mono);font-size:10.5px;color:var(--ice-faint);padding:6px 20px;border-bottom:1px solid var(--line);}
  .status-locked{background:rgba(147,174,194,0.12);color:var(--ice-dim);}
  .std-pts{font-family:var(--font-mono);font-weight:700;color:var(--ice);}
  .team-hl td{background:rgba(213,38,47,0.10);}
  .filter-row select.date-select{min-width:160px;}
  .week-nav{display:inline-flex;align-items:stretch;gap:4px;}
  .week-nav .week-arrow{font-size:16px;line-height:1;padding:4px 11px;}
  .week-nav .week-arrow[disabled]{opacity:.35;cursor:default;}
  .week-label{display:inline-flex;flex-direction:column;align-items:center;gap:1px;min-width:132px;}
  .week-dates{font-size:9.5px;letter-spacing:0.04em;opacity:.75;font-weight:500;}
  .filters-panel .filter-search{width:100%;max-width:420px;border-radius:8px;margin-bottom:6px;}
  .filter-label{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ice-faint);margin:10px 0 5px;}
  .filters-panel .filter-row{margin-bottom:2px;}
  .filters-panel .date-select{width:100%;max-width:260px;font-family:var(--font-body);text-transform:none;letter-spacing:0;font-weight:500;font-size:13px;padding:8px 10px;}
  .team-sugg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:12px;}
  .team-sugg .filter-chip{width:100%;margin:0;text-align:center;justify-content:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:6px;padding-right:6px;}
  .sugg-club{grid-column:1/-1;font-family:var(--font-mono);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin:6px 0 -2px;}
  .sugg-club:first-child{margin-top:0;}
  #match-search::-webkit-search-decoration{display:none;}
  .team-sugg-all{max-height:300px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px;border:1px solid var(--line, #22324a);border-radius:12px;}
  .tab{position:relative;}

  /* ===== Mode clair : "Bleu hockey" ===== */

  :root[data-theme="light"] .sheet-backdrop{background:rgba(11,37,71,.35);}
  :root[data-theme="light"] .tabs{box-shadow:0 -1px 8px rgba(11,37,71,.08);}
  :root[data-theme="light"] .surf-btn.active, :root[data-theme="light"] .vs-btn.active, :root[data-theme="light"] .joker-btn.on,
  :root[data-theme="light"] .xp-joker.on, :root[data-theme="light"] .joker-badge, :root[data-theme="light"] .invite-btn.copy .ib-ico{color:#fff;}

       --ice:#eaf6fb;--ice-dim:#93aec2;--line:#24425e;--panel-2:#16293d;color:var(--ice);}
  .top-l{min-width:0;}
  .brand{font-family:var(--font-display);font-size:26px;line-height:1;text-transform:uppercase;letter-spacing:.01em;}
  .brand span{color:var(--red);}
  .top-room{font-family:var(--font-mono);font-size:10.5px;color:var(--ice-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top-r{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .me-pill{font-family:var(--font-body);font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--red);background:var(--red);color:#fff;cursor:pointer;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .me-pill .chev{color:#fff;opacity:.8;}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--ice-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .icon-btn.on{color:var(--ice);border-color:var(--ice-dim);}
  .back{margin:0 0 12px;}
  .h2{font-family:var(--font-display);font-size:19px;text-transform:uppercase;letter-spacing:.02em;margin:20px 0 8px;color:var(--ice);}
  .red{color:var(--red);}
  .empty{padding:36px 16px;}

  /* semaine, categories */
  .wk{display:flex;align-items:stretch;gap:6px;margin:0 0 10px;}
  .wk-arrow{flex:none;width:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ice);font-size:22px;line-height:1;cursor:pointer;}
  .wk-label{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 8px;border-radius:10px;border:1px solid var(--gold);background:var(--panel-3);color:var(--gold);

  .chips{display:flex;gap:6px;margin:0 0 10px;}

  .chip2{flex-shrink:0;font-family:var(--font-body);font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ice-dim);cursor:pointer;white-space:nowrap;}

  .wk-sum{font-size:13px;color:var(--ice-dim);margin:2px 0 4px;min-height:18px;}

  .wk-sum b.red{color:var(--red);}

  .legend2{font-size:12px;color:var(--ice-faint);line-height:1.5;margin:18px 0 0;}
  .legend2 b{color:var(--gold);}

  /* une ligne de prono */
  .pr{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);}

  .pts-good{background:rgba(47,174,102,.18);color:var(--green);}

  .pts-none{color:var(--ice-faint);}

  .final span{font-family:var(--font-mono);font-size:10px;color:var(--ice-faint);}
  .pr-detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);cursor:default;}
  .pr-where{font-family:var(--font-mono);font-size:10.5px;color:var(--ice-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}

function catInfo(c){
  /* indoor : un groupe a part, range comme l'outdoor (seniors, puis jeunes de U19 a U7) */
  if(/ Indoor$/.test(c)){
    if(/^(Men|Women)$/.test(c.replace(/ Indoor$/, ""))) return {g:4, k:"00" + (/^Women/.test(c) ? "1" : "0")};
    var bi = catInfo(c.replace(/ Indoor$/, ""));
    return {g:4, k:String(bi.g) + bi.k};
  }
  var pad = function(n){ return String(1000 + n).slice(1); };
  var sex = /Women|Dames|Girls|Ladies/.test(c) ? 1 : (/Gentlemen/.test(c) ? 2 : 0);
  var m;
  if(sex === 2 && /^(Open|Fun) League/.test(c)) return {g:3, k:"0" + (/^Open/.test(c) ? "0" : "1")};
  if(/^Top League/.test(c)) return {g:0, k:"0" + sex};
  if(/^Belgian League/.test(c)) return {g:0, k:"1" + sex};
  if(/^Open League/.test(c)) return {g:0, k:"2" + sex};
  if(/^Fun League/.test(c)) return {g:0, k:"3" + sex};
  if(c === "Ladies") return {g:3, k:"1"};
  if(c === "Junior Ladies") return {g:3, k:"2"};
  if((m = /^(\d+)\+/.exec(c))) return {g:3, k:"3" + pad(+m[1])};
  if(/^Trimmers/.test(c)) return {g:3, k:"4"};
  if((m = /^U(\d+)\s*(.*)$/.exec(c))) return {g:1, k:pad(100 - +m[1]) + (/Girls/.test(m[2]) ? "1" : "0")};
  if(/^EHL/.test(c)) return {g:2, k:"!" + sex};
  if(/Cup/.test(c)){
    var rounds = ["1st round", "1/64", "1/32", "1/16", "1/8", "1/4", "1/2", "final"];
    var r = rounds.findIndex(function(x){ return c.toLowerCase().indexOf(x.toLowerCase()) !== -1; });
    var base = c.replace(/\s*(1st round|1\/\d+( finals)?|finals?)\s*$/i, "");

}

async function syncFromHockeyBe(){
  if(!state.pools.length) return 0;
  state.syncing = true; render();
  var changes = 0, failed = [];
  try{
    if(state.pools.some(function(p){ return /^ehl-/.test(p); })){
      await loadSnapshot(true);
      if(SNAP.state !== "ok") failed.push("Euro Hockey League");
    }
    for(var i = 0; i < state.pools.length; i++){
      var pid = state.pools[i];
      if(/^ehl-/.test(pid)){
        if(SNAP.state !== "ok") continue;
        EXT.matches.forEach(function(m){
          if(m.pool !== pid) return;
          changes += upsertMatch({pool:pid, teamA:m.teamA, teamB:m.teamB, date:m.date, time:m.time, venue:m.venue,
            scoreA:m.scoreA, scoreB:m.scoreB, status:m.status, official:true});
        });
        state.standings[pid] = EXT.standings[pid] || [];
        continue;
      }
      var res;
      try{ res = await Promise.all([apiGet(pid,"program"), apiGet(pid,"results"), apiGet(pid,"standing")]); }
      catch(e){ failed.push(poolName(pid)); continue; }
      var program = res[0], results = res[1], standing = res[2];

      program.forEach(function(r){
        var dv = stripHtml(r[0]).split(" | ");
        var a = teamName(r[3]), b = teamName(r[r.length-1]);
        changes += upsertMatch({pool:pid, teamA:a, teamB:b, date:isoDate(dv[0]), time:(r[1]||"").slice(0,5), venue:dv[1] || null});
      });
      results.forEach(function(r){
        var a = teamName(r[3]), b = teamName(r[r.length-1]);
        var sc = stripHtml(r[5] || "");
        var m = /(\d+)\s*-\s*(\d+)/.exec(sc);
        var status = sc.replace(/(\d+)\s*-\s*(\d+)/, "").trim() || null;
        changes += upsertMatch({pool:pid, teamA:a, teamB:b, date:isoDate(r[0]), time:(r[1]||"").slice(0,5),
          scoreA: m ? parseInt(m[1],10) : null, scoreB: m ? parseInt(m[2],10) : null, status: m ? (status || null) : (sc || null), official:true});
      });
      if(standing.length || !(state.standings[pid] || []).length) state.standings[pid] = standing.map(function(s){
        return {rank:s[0], team:s[1], j:s[2], g:s[3], p:s[4], n:s[5], bp:s[6], bc:s[7], pts:s[8]};
      });
    }
    state.lastSync = new Date().toISOString();
    await saveCloud();
    if(failed.length) showToast("hockey.be n'a pas repondu pour : " + failed.join(", ") + ". Reessayez Actualiser.");
  }catch(e){
    showToast("Synchronisation hockey.be impossible");
  }
  state.syncing = false;
  return changes;
}
function upsertMatch(o){
  var id = matchKey(o.pool, o.teamA, o.teamB);
  var m = state.matches.find(function(x){ return x.id === id; });
  if(!m){
    m = {id:id, pool:o.pool, teamA:o.teamA, teamB:o.teamB, date:o.date, time:o.time, venue:o.venue || null,
         scoreA:null, scoreB:null, status:null, manual:false};
    state.matches.push(m);
  }
  var changed = 0;
  if(o.date && m.date !== o.date){ m.date = o.date; changed = 1; }
  if(o.time && m.time !== o.time){ m.time = o.time; changed = 1; }
  if(o.venue && m.venue !== o.venue){ m.venue = o.venue; changed = 1; }
  if(o.official){
    if(o.scoreA !== null && !m.manual && (m.scoreA !== o.scoreA || m.scoreB !== o.scoreB)){
      m.scoreA = o.scoreA; m.scoreB = o.scoreB; changed = 1;
    }
    if((o.status || null) !== (m.status || null)){ m.status = o.status; changed = 1; }
  }
  return changed;
}

function renderSearchResults(q){

  var tRank = function(t){ var l = t.toLowerCase(); return (mine[t] ? 0 : 3) + (l.indexOf(q) === 0 ? 0 : ((" " + l).indexOf(" " + q) !== -1 ? 1 : 2)); };

  teams.sort(function(a, b){ var x = teamParts(a), y = teamParts(b);
    return clubRank[x.club] - clubRank[y.club] || x.club.localeCompare(y.club) || x.kind - y.kind || x.num - y.num || a.localeCompare(b); });
  var nq = function(s){ return s.toLowerCase().replace(/\./g, "").replace(/\s+/g, " "); }, qn = nq(q);

  var hasAll = function(txt){ return phraseHit ? nq(txt).indexOf(qn) !== -1 : byWords(txt); };
  var pools = ALL_POOLS.filter(function(x){ return x[2] > 0 && !isIsolatedPool(x[1]) && hasAll(shortPool(x[1])); })
    .sort(function(a, b){ var x = catInfo(poolGroup(a[1])), y = catInfo(poolGroup(b[1])); return x.g - y.g || x.k.localeCompare(y.k) || shortPool(a[1]).localeCompare(shortPool(b[1])); });
  var html = "";

  /* categories (U19 Boys, Ladies, EHL...) : toucher ouvre la liste de leurs poules */
  var myCats = {}; state.pools.forEach(function(pid){ myCats[poolCat(pid)] = 1; });
  var cats = extCategories().filter(function(c){ return hasAll(c); });
  if(cats.length){

      return '<button class="li" data-action="goto-cat" data-cat="' + escapeHtml(c) + '"><span class="li-t">' + escapeHtml(c) + (myCats[c] ? ' &#9733;' : '') + '</span>' +
        '<span class="li-s">' + extPoolsOf(c).length + ' poule' + (extPoolsOf(c).length > 1 ? "s" : "") + '</span><span class="li-go">&#8250;</span></button>';
    }).join("") + '</div>';
  }
  /* recherche combinee : club + niveau (ex : "nat old cl" = equipes de Old Club en Nat.) */
  var combo = [];
  /* le texte tel quel au debut d'un mot d'une equipe (ex : "racing h-1") : on garde la recherche simple */
  var atWordStart = function(t){ var l = " " + t.toLowerCase(), i = l.indexOf(qn, 1); while(i !== -1){ if(/[\s-]/.test(l.charAt(i - 1))) return true; i = l.indexOf(qn, i + 1); } return false; };

    var ptoks = function(pid){ return nq(poolName(pid)).split(/[\s-]+/); };
    /* cm : comment un mot est compare au nom du club (debut de mot, ou n'importe ou) */

  }
  if(teams.length && others.length){
    html += '<h2 class="h2">Aussi trouve dans le nom (' + others.length + ')</h2>';
    if(others.length <= 15 || state.othersAll) html += '<div class="team-sugg' + (others.length > 15 ? ' team-sugg-all' : '') + '">' + teamSuggHtml(others) + '</div>';

  }

    } else {
      var up = sortMatches(mine.filter(function(m){ return !hasScore(m) && (!m.date || m.date >= today); }));
      var played = sortMatches(mine.filter(function(m){ return hasScore(m) || (m.date && m.date < today); })).reverse();
      html += '<h2 class="h2">A venir' + tag + ' (' + up.length + ')</h2>' + (up.length ? '<div class="admin-form row-list">' + up.slice(0, 10).map(function(m){ return matchRow(m); }).join("") + '</div>' : '<p class="points-sub">Aucun match a venir.</p>');

  });
  return html;
}

var ACTIONS = {
  /* --- navigation --- */

  /* --- pronos --- */

  "cat": function(el){ state.cat = el.getAttribute("data-cat"); render(); },
  "row": function(el){ var id = el.getAttribute("data-match"); state.open[id] = !state.open[id]; render(); },
  "xp": function(el){
    var id = el.getAttribute("data-match"), side = el.getAttribute("data-side"), d = +el.getAttribute("data-d");
    var m = state.matches.find(function(x){ return x.id === id; });
    if(!m || !state.me) return;
    if(isLocked(m)){ showToast("Match commence : pronostic ferme"); render(); return; }
    if(!state.predictions[id]) state.predictions[id] = {};
    var pr = state.predictions[id][state.me];
    if(!pr || pr.a === undefined){ var j = pr && pr.j; pr = {a:0, b:0}; if(j) pr.j = true; state.predictions[id][state.me] = pr; if(d > 0) pr[side] = 1; }
    else pr[side] = Math.max(0, Math.min(30, (pr[side] || 0) + d));
    ["a", "b"].forEach(function(s){ var v = document.getElementById("xp-" + s + "-" + id); if(v){ v.textContent = pr[s]; v.classList.remove("xp-empty"); } });
    var row = document.getElementById("row-" + id); if(row){ row.classList.remove("todo"); row.classList.add("ok"); }
    var ok = document.getElementById("xp-ok-" + id); if(ok) ok.innerHTML = '<span class="saving">...</span>';
    clearTimeout(xpTimers[id]);
    xpTimers[id] = setTimeout(async function(){
      var saved = await savePrediction(id, state.me, pr);
      var ok2 = document.getElementById("xp-ok-" + id);
      if(!saved){ showToast("Sauvegarde impossible (connexion ?)"); if(ok2) ok2.innerHTML = "!"; return; }
      if(ok2) ok2.innerHTML = "&#10003;";
      var sum = document.getElementById("wk-sum");
      if(sum){ var wr = weekRange(state.weekOffset); sum.innerHTML = weekSummary(state.matches.filter(function(x){ return x.date ? (x.date >= wr.start && x.date <= wr.end && (!state.cat || poolCat(x.pool) === state.cat)) : state.weekOffset === 0; })); }
      updateMissingBadge(); scheduleNotifs();
    }, 600);
  },
  "toggle-joker": async function(el){
    var id = el.getAttribute("data-match"), m = state.matches.find(function(x){ return x.id === id; });
    if(!m || isLocked(m) || !state.me) return;
    var pr = myPred(m);
    if(!pr || pr.a === undefined){ showToast("Mets d'abord ton score pour ce match"); return; }
    var saves = [];
    if(pr.j){ delete pr.j; saves.push([m.id, pr]); }
    else {
      var other = jokerMatchOf(state.me, weekKey(m.date));
      if(other && isLocked(other)){ showToast("Joker deja joue cette semaine"); return; }
      if(other){ var op = myPred(other); delete op.j; saves.push([other.id, op]); }
      pr.j = true; saves.push([m.id, pr]);
    }
    render();
    var ok = true;
    for(var i = 0; i < saves.length; i++) ok = (await savePrediction(saves[i][0], state.me, saves[i][1])) && ok;
    showToast(!ok ? "Sauvegarde impossible (connexion ?)" : (pr.j ? "Joker pose : points x2 sur " + m.teamA + " - " + m.teamB : "Joker retire"));
  },

  "season-del": async function(el){
    var qid = el.getAttribute("data-q"); if(!state.seasonQ[qid]) return;
    if(el.getAttribute("data-sure") !== "1"){ el.setAttribute("data-sure", "1"); el.textContent = "Confirmer la suppression"; el.classList.add("btn-primary"); return; }
    delete state.seasonQ[qid]; delete state.seasonPicks[qid];
    var ok = (await fbSet("seasonQ/" + qid, null)) && (await fbSet("seasonPicks/" + qid, null));
    showToast(ok ? "Question supprimee" : "Suppression incomplete (connexion ?)");
    render();
  },

  /* --- reglages --- */
  "set-theme": function(el){ setLocal("hb-theme", el.getAttribute("data-theme")); applyTheme(); render(); },
  "sync-now": async function(){
    await refreshCloud();
    var n = await syncFromHockeyBe(); render();
    showToast(n ? n + " mise(s) a jour depuis hockey.be" : "Tout est a jour");
  },
  "pick-group": function(el){
    var g = el.getAttribute("data-group"), q = state.pickerSearch.toLowerCase();
    var ids = ALL_POOLS.filter(function(p){ return p[2] > 0 && (state.showIsolated || !isIsolatedPool(p[1])) && poolGroup(p[1]) === g && (!q || shortPool(p[1]).toLowerCase().indexOf(q) !== -1 || p[1].toLowerCase().indexOf(q) !== -1); }).map(function(p){ return p[0]; });
    var allOn = ids.every(function(id){ return state.pickerSel.indexOf(id) !== -1; });
    ids.forEach(function(id){ var i = state.pickerSel.indexOf(id); if(allOn && i !== -1) state.pickerSel.splice(i, 1); if(!allOn && i === -1) state.pickerSel.push(id); });
    render();
  },
  "save-pools": async function(){
    if(!state.pickerSel.length){ showToast("Garde au moins une poule"); return; }
    state.pools = state.pickerSel.slice();
    state.matches = state.matches.filter(function(m){ return state.pools.indexOf(m.pool) !== -1; });
    Object.keys(state.standings).forEach(function(k){ if(state.pools.indexOf(k) === -1) delete state.standings[k]; });
    state.poolEditorOpen = false; state.pickerSearch = ""; state.pickerSel = [];
    await syncFromHockeyBe(); render(); showToast("Poules mises a jour");
  },
  "save-final": async function(el){
    var id = el.getAttribute("data-match");
    var a = parseInt(document.querySelector('[data-role="final-a"][data-match="' + id + '"]').value, 10);
    var b = parseInt(document.querySelector('[data-role="final-b"][data-match="' + id + '"]').value, 10);
    var m = state.matches.find(function(x){ return x.id === id; });
    if(!m) return;
    if(isNaN(a) || isNaN(b)){ m.scoreA = null; m.scoreB = null; } else { m.scoreA = a; m.scoreB = b; }
    m.manual = true;
    await saveCloud(); render(); showToast("Score enregistre, points mis a jour");
  },
  "unmanual": async function(el){
    var m = state.matches.find(function(x){ return x.id === el.getAttribute("data-match"); });
    if(!m) return;
    m.manual = false; m.scoreA = null; m.scoreB = null;
    await syncFromHockeyBe(); render(); showToast("Score repris de hockey.be");
  },
  "leave-room": function(){ setLocal(LOCAL_ROOM_KEY, null); state.room = null; state.settings = false; render(); },
  "delete-room": async function(){
    if(!isOwner()) return;
    if(val("delete-room-confirm").trim().toLowerCase() !== state.room){ showToast("Tape exactement le nom de la partie pour confirmer"); return; }
    try{ var res = await fetch(roomUrl(state.room), {method:"DELETE"}); if(!res.ok) throw new Error(); }
    catch(e){ showToast("Suppression impossible (connexion ?)"); return; }
    var name = state.room;
    setLocal(LOCAL_ROOM_KEY, null);
    state.room = null; state.players = []; state.pools = []; state.matches = []; state.predictions = {}; state.standings = {}; state.lastSync = null; state.me = null; state.pinSheet = null;
    state.tab = "pronos"; state.settings = false; render();
    showToast("Partie " + name + " supprimee");
  },

  /* --- creer / rejoindre --- */
  "create-room": async function(){
    var code = roomCodeFrom("create-room-code");
    if(!state.pickerSel.length){ showToast("Choisis au moins une poule"); return; }
    if(!code){ showToast("Choisis un nom (lettres/chiffres) pour la partie"); return; }
    state.joinBusy = true; render();
    try{
      var existing = null; try{ existing = await fetchRoom(code); }catch(e){}
      if(existing) throw new Error("room-exists");
      state.room = code; state.pools = state.pickerSel.slice(); state.players = []; state.matches = []; state.predictions = {}; state.standings = {};
      await syncFromHockeyBe();
      setLocal(LOCAL_ROOM_KEY, code);
      state.joinBusy = false; state.pickerSel = []; state.pickerSearch = ""; state.playerSheet = true; state.addingPlayer = true; render();
      showToast("Partie creee : " + code + " (" + state.matches.length + " matchs). Ajoute ton prenom.");
    }catch(e){
      state.room = null; state.joinBusy = false;
      state.joinError = e.message === "room-exists" ? "Ce nom est deja pris, choisis-en un autre." : "La creation a echoue (" + e.message + ").";
      render();
    }
  },
  "join-room": async function(){
    var code = roomCodeFrom("join-room-code");
    if(!code){ state.joinError = "Entre le nom de la partie."; render(); return; }
    state.joinBusy = true; state.joinError = null; render();
    try{
      applyRoom(await fetchRoom(code));
      state.room = code; setLocal(LOCAL_ROOM_KEY, code);
      state.joinBusy = false; state.playerSheet = true; render(); showToast("Partie rejointe !");
      syncFromHockeyBe().then(render);
    }catch(e){ state.joinBusy = false; state.joinError = "Partie introuvable. Verifie le nom."; render(); }
  }
};
async function setSeasonAnswer(qid, team){
  if(!state.seasonQ[qid]) return;
  state.seasonQ[qid].answer = team || null;
  var ok = await fbSet("seasonQ/" + qid + "/answer", team || null);
  showToast(ok ? (team ? "Reponse validee : " + team : "Validation annulee") : "Enregistrement impossible (connexion ?)");
  render();
}

/* changements de listes, cases a cocher, dates */
var CHANGES = {
  "explore-cat": function(el){ state.exploreCat = el.value; render(); },
  "sq-pool": function(el){ state.seasonPool = el.value; render(); }
};
var CHANGE_ACTIONS = {
  "season-on": async function(el){
    state.seasonOn = el.checked; render();
    var ok = await fbSet("settings/seasonOn", el.checked);
    showToast(ok ? (el.checked ? "Pronos de saison affiches" : "Pronos de saison masques") : "Enregistrement impossible (connexion ?)");
  },
  "season-pick": async function(el){
    var qid = el.getAttribute("data-q"), q = state.seasonQ[qid];
    if(!q || !state.me) return;
    if(seasonLocked(q) || q.answer){ showToast("Cette question est fermee"); render(); return; }
    var v = el.value || null;
    state.seasonPicks[qid] = state.seasonPicks[qid] || {};
    if(v) state.seasonPicks[qid][state.me] = v; else delete state.seasonPicks[qid][state.me];
    state.seasonBoxOpen = true;
    var ok = await fbSet("seasonPicks/" + qid + "/" + state.me, v);
    showToast(ok ? (v ? "Enregistre : " + v : "Reponse retiree") : "Enregistrement impossible (connexion ?)");
    render();
  },
  "season-dl": async function(el){
    var qid = el.getAttribute("data-q"); if(!state.seasonQ[qid] || !el.value) return;
    state.seasonQ[qid].deadline = el.value;
    var ok = await fbSet("seasonQ/" + qid + "/deadline", el.value);
    showToast(ok ? "Date limite : " + formatDate(el.value) : "Enregistrement impossible (connexion ?)");
    render();
  },
  "notif-set": function(el){ setLocal("hb-notif-" + el.getAttribute("data-k"), el.checked ? "1" : "0"); lastNotifSig = ""; scheduleNotifs(); },
  "pick-pool": function(el){ var p = el.getAttribute("data-pool"), i = state.pickerSel.indexOf(p); if(i === -1) state.pickerSel.push(p); else state.pickerSel.splice(i, 1); render(); },
  "toggle-isolated": function(el){ state.showIsolated = el.checked; render(); }
};
/* champs de recherche : on redessine en gardant le curseur */
var INPUTS = {
  "match-search": function(el){ state.q = el.value; state.teamSuggAll = false; state.othersAll = false; if(state.q.trim().length >= 2) loadSnapshot(false); },
  "pool-search": function(el){ state.pickerSearch = el.value; },
  "fix-q": function(el){ state.fixQ = el.value; }
};
var ENTER = {"new-player-name":"confirm-add-player", "welcome-name":"welcome-join", "create-room-code":"create-room", "join-room-code":"join-room"};

function installEvents(){
  document.addEventListener("click", function(e){
    if(e.target.closest("[data-clear]")) return;
    var pin = e.target.closest("[data-pin-key]");
    if(pin){ pinKey(pin.getAttribute("data-pin-key")); return; }
    var el = e.target.closest("[data-action]");
    if(!el || el.tagName === "SELECT" || el.tagName === "INPUT") return;
    var fn = ACTIONS[el.getAttribute("data-action")];
    if(fn){ e.preventDefault(); fn(el, e); }
  });
  document.addEventListener("change", function(e){
    var el = e.target;
    if(CHANGES[el.id]) return CHANGES[el.id](el);
    var a = el.getAttribute && el.getAttribute("data-action");
    if(a && CHANGE_ACTIONS[a]) CHANGE_ACTIONS[a](el);
  });
  document.addEventListener("input", function(e){
    var el = e.target, fn = INPUTS[el.id];
    if(el.id === "match-search"){ fn(el); refreshMatchsBody(); return; }
    if(fn){ var pos = el.selectionStart; fn(el); render(); keepFocus(el.id, pos); return; }
    if(el.getAttribute("data-role") === "final-a" || el.getAttribute("data-role") === "final-b") el.value = el.value.replace(/[^0-9]/g, "").slice(0, 2);
  });
  document.addEventListener("keydown", function(e){
    if(e.key !== "Enter" || !e.target.id) return;
    if(ENTER[e.target.id]){ e.preventDefault(); ACTIONS[ENTER[e.target.id]](e.target); }
    else if(e.target.id === "match-search"){ e.preventDefault(); e.target.blur(); }
  });
  /* les <details> se souviennent s'ils sont ouverts quand l'ecran est redessine */
  document.addEventListener("toggle", function(e){
    var d = e.target;
    if(d.id === "season-box") state.seasonBoxOpen = d.open;
    else if(d.id === "season-res") state.seasonResOpen = d.open;
    else if(d.id === "fix-scores") state.fixOpen = d.open;
    else if(d.id === "pool-editor"){
      if(d.open === !!state.poolEditorOpen) return;
      state.poolEditorOpen = d.open;
      if(d.open){ if(!state.pickerSel.length) state.pickerSel = state.pools.slice(); render(); }
      else state.pickerSearch = "";
    }
  }, true);
}

/* ===================== v2 : demarrage ===================== */
async function init(){
  installEvents();
  document.getElementById("app").innerHTML = '<div class="empty" style="padding-top:120px;"><div class="big">Chargement...</div></div>';
  state.room = getLocal(LOCAL_ROOM_KEY);
  state.me = getLocal(LOCAL_ME_KEY);
  if(state.room && !(await refreshCloud())){ state.room = null; setLocal(LOCAL_ROOM_KEY, null); }
  var joined = await joinFromLink();
  if(state.me && state.players.indexOf(state.me) === -1) state.me = null;
  if(state.pools.some(function(p){ return /^ehl-/.test(p); }) || (state.me && myFavs().length)) loadSnapshot(false);
  if(!state.me && !joined && state.players.length === 1 && !hasPin(state.players[0])) state.me = state.players[0];
  render();
  if(state.room && isStale()){ await syncFromHockeyBe(); render(); }
}

init();
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && state.room){ liveTick(); }
});
setInterval(liveTick, 5 * 60 * 1000);

})();
</script>
