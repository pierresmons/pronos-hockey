# Rappels de pronos (notifications push), seulement aux joueurs a qui il manque des pronos et qui ont active les rappels :
#  - la veille de chaque jour de match (18h-23h, heure belge) pour les matchs de ce jour ;
#    filet : le jour meme des 7h, au plus tard 2 h avant le premier match ;
#  - le mardi soir pour les matchs du week-end ; filet : mercredi 7h-13h.
# Le script verifie lui-meme l'heure de Bruxelles (ete/hiver) et n'envoie chaque rappel qu'une fois par partie.
# Reveil toutes les heures : GitHub lance les taches programmees avec 4 a 5 h de retard (constate en novembre 2026),
# le premier passage qui tombe dans une bonne fenetre envoie, les autres ne font rien.
#
# Bouton "Run workflow" : mode "test" = notification d'essai tout de suite au joueur indique ;
# mode "simulation" = montre ce qui serait envoye les 7 prochains soirs a 19h, sans rien envoyer.
name: Rappels pronos

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test, simulation ou rappel"
        type: choice
        options: [test, simulation, rappel]
        default: test
      joueur:
        description: "Pour le test : prenom exactement comme dans l'app"
        default: "Piet"

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer pywebpush
        run: pip install --quiet "pywebpush>=2,<3"
      - name: Envoyer les rappels
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          MODE: ${{ github.event.inputs.mode || 'rappel' }}
          JOUEUR: ${{ github.event.inputs.joueur }}
        run: python scripts/notify.py
