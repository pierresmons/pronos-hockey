# Robot Pronos Hockey : met a jour data/hockey-snapshot.json depuis hockey.be
#
# Horaires (heure belge) :
#   lundi a vendredi : 2h
#   samedi           : 2h, puis 12h, 14h, 16h, 18h, 20h
#   dimanche         : 12h, 14h, 17h, 20h
#
# A chaque passage, l'EHL est mise a jour EN PREMIER (quelques secondes) et enregistree tout de suite :
# meme si la longue lecture de hockey.be echoue ou traine, les scores EHL sont en ligne.
# Euro Hockey League, FIH Pro League et Hoofdklasse : les jours de match, le robot met aussi a jour celles-la seules
# (quelques secondes) toutes les 30 minutes entre 9h et minuit.
# Archive de la saison (10/11/2026) : chaque lundi apres la lecture de 2h, data/archives/saison-AAAA-AA.json
# garde tous les matchs joues et les classements de la saison (donnees publiques de hockey.be).
# Chasseur de scores (09/11/2026) : toutes les 30 minutes entre 11h et minuit, le robot relit seulement les poules
# des parties et des equipes favorites ou un match est fini depuis plus de 1h30 sans score (quelques secondes).
#
# GitHub lance les taches programmees avec du retard (parfois plusieurs heures) ou en saute
# (novembre 2026 : un passage toutes les 4 h environ). Depuis le 09/11, cron-job.org lance aussi le robot
# toutes les 30 min (bouton "Run workflow" via l'API, avec auto = true) : il se comporte alors comme un reveil
# programme (le controle decide), au lieu de forcer une mise a jour complete comme le bouton a la main.
# Le robot se reveille donc toutes les heures et ne travaille que si un horaire
# ci-dessus est passe depuis le dernier snapshot : un retard est rattrape au reveil suivant.
# Changement d'heure ete/hiver gere tout seul (heure de Bruxelles).
name: Snapshot hockey.be

on:
  schedule:
    - cron: "23 * * * *"                         # reveil toutes les 30 min (le controle decide)
    - cron: "53 * * * *"
  workflow_dispatch:                             # bouton "Run workflow" pour lancer a la main
    inputs:
      auto:
        description: "Reveil automatique (cron-job.org) : laisser le controle decider. A la main : laisser decoche"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 50                           # le robot s'arrete seul apres 40 min de lecture (DEADLINE_MIN)
    steps:
      - uses: actions/checkout@v5
      - name: Verifier si une mise a jour est due
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          AUTO: ${{ github.event.inputs.auto }}
        run: |
          python3 - <<'PY'
          import os, json, datetime as dt
          from zoneinfo import ZoneInfo
          BXL = ZoneInfo("Europe/Brussels")
          WANTED = {0: [2], 1: [2], 2: [2], 3: [2], 4: [2],
                    5: [2, 12, 14, 16, 18, 20],
                    6: [12, 14, 17, 20]}
          now = dt.datetime.now(BXL)
          # dernier horaire prevu deja passe (on remonte jusqu'a 7 jours)
          last_slot = None
          for back in range(8):
              day = (now - dt.timedelta(days=back)).date()
              for h in sorted(WANTED[day.weekday()], reverse=True):
                  slot = dt.datetime(day.year, day.month, day.day, h, 0, tzinfo=BXL)
                  if slot <= now:
                      last_slot = slot; break
              if last_slot: break
          try:
              gen = json.load(open("data/hockey-snapshot.json")).get("generated")
              gen = dt.datetime.strptime(gen, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=dt.timezone.utc)
          except Exception:
              gen = None
          auto = os.environ["EVENT"] == "schedule" or os.environ.get("AUTO") == "true"
          full = not auto or gen is None or gen < last_slot
          # jour de match EHL : mise a jour rapide de l'EHL seule si la derniere a plus de 25 min
          ehl = False
          try:
              snap = json.load(open("data/hockey-snapshot.json"))
              eg = snap.get("ehlGenerated") or snap.get("generated")
              eg = dt.datetime.strptime(eg, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=dt.timezone.utc)
              today = now.date().isoformat(); yday = (now.date() - dt.timedelta(days=1)).isoformat()
              pools = snap.get("pools", [])
              for m in snap.get("matches", []):
                  if not pools[m[0]][0].startswith(("ehl-", "fihpl-", "nlhk-")):
                      continue
                  if m[1] == today or (m[1] == yday and m[5] is None):
                      ehl = True
                      break
              age = (dt.datetime.now(dt.timezone.utc) - eg).total_seconds()
              ehl = ehl and 9 <= now.hour <= 23 and age > 25 * 60
              # pas encore de donnees EHL (site EHL en panne au dernier passage) : nouvel essai toutes les 30 min
              if not any(p[0].startswith("ehl-") for p in pools) and 7 <= now.hour <= 23 and age > 25 * 60:
                  ehl = True
          except Exception:
              ehl = False
          run = full or ehl
          scores = (not full) and 11 <= now.hour <= 23
          archive = full and (now.weekday() == 0 or not os.path.exists("data/archives"))
          print(f"Maintenant {now:%a %d/%m %H:%M}, dernier horaire {last_slot:%a %d/%m %H:%M}, "
                f"snapshot du {gen.astimezone(BXL):%a %d/%m %H:%M}" if gen else "pas de snapshot",
                "-> mise a jour complete" if full else ("-> mise a jour EHL" if ehl else "-> deja a jour"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if run else 'false'}\n")
              f.write(f"mode={'full' if full else 'ehl'}\n")
              f.write(f"scores={'true' if scores else 'false'}\n")
              f.write(f"archive={'true' if archive else 'false'}\n")
          PY
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true' || steps.gate.outputs.scores == 'true'
        with:
          python-version: "3.12"
      - name: EHL, Pro League et Hoofdklasse (rapide, toujours en premier)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: python scripts/snapshot.py --ehl-only
      - name: Enregistrer EHL, Pro League et Hoofdklasse
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "robot-pronos-hockey"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hockey-snapshot.json
          if git diff --cached --quiet; then
            echo "Rien de neuf pour l'EHL"
          else
            git commit -m "EHL + Pro League + Hoofdklasse $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
      - name: Chasseur de scores (poules des parties et des favoris)
        if: steps.gate.outputs.scores == 'true'
        continue-on-error: true
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: python scripts/snapshot.py --scores
      - name: Enregistrer les scores
        if: steps.gate.outputs.scores == 'true'
        run: |
          git config user.name "robot-pronos-hockey"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hockey-snapshot.json
          if git diff --cached --quiet; then
            echo "Aucun nouveau score"
          else
            git commit -m "Scores $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
      - name: Recuperer hockey.be
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.mode == 'full'
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: python scripts/snapshot.py
      - name: Enregistrer hockey.be
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.mode == 'full'
        run: |
          git add data/hockey-snapshot.json
          if git diff --cached --quiet; then
            echo "Rien de neuf"
          else
            git commit -m "Snapshot hockey.be $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
      - name: Archiver la saison (le lundi)
        if: steps.gate.outputs.archive == 'true'
        continue-on-error: true
        run: |
          python scripts/snapshot.py --archive
          git add data/archives
          if git diff --cached --quiet; then
            echo "Archive inchangee"
          else
            git commit -m "Archive saison $(date -u +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
